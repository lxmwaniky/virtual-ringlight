<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Virtual Ring Light</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="brand">
        <div class="logo-ring" id="logo-ring"></div>
        <div class="title-group">
          <h1>Virtual Ring Light</h1>
          <span class="subtitle">Screen Fill Light</span>
        </div>
      </div>
      <div class="toggle-wrapper">
        <label class="switch" title="Toggle Ring Light">
          <input type="checkbox" id="power-toggle" />
          <span class="slider round"></span>
        </label>
      </div>
    </header>

    <main class="main-content">
      <section class="section">
        <label class="section-label">Color Temperature</label>
        <div class="preset-grid">
          <button class="preset-btn" data-preset="warm" data-color="#fff1d6" title="Warm Light (3000K)">
            <span class="color-dot warm"></span>
            <span>Warm</span>
          </button>
          <button class="preset-btn" data-preset="daylight" data-color="#ffffff" title="Neutral Daylight (4500K)">
            <span class="color-dot daylight"></span>
            <span>Daylight</span>
          </button>
          <button class="preset-btn" data-preset="cool" data-color="#e2f1ff" title="Cool Light (6000K)">
            <span class="color-dot cool"></span>
            <span>Cool</span>
          </button>
          <div class="color-picker-wrapper" title="Custom Tint">
            <input type="color" id="custom-color-picker" value="#ffffff" />
            <span class="picker-label">Custom</span>
          </div>
        </div>
      </section>

      <section class="section">
        <label class="section-label">Overlay Shape</label>
        <div class="shape-grid four-col">
          <button class="shape-btn active" data-shape="frame" title="Full Perimeter Frame">
            <svg viewBox="0 0 24 24" class="shape-icon"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="3"/></svg>
            <span>Frame</span>
          </button>
          <button class="shape-btn" data-shape="top-strip" title="Top Webcam Fill">
            <svg viewBox="0 0 24 24" class="shape-icon"><line x1="3" y1="4" x2="21" y2="4" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
            <span>Top Bar</span>
          </button>
          <button class="shape-btn" data-shape="side-strips" title="Dual Side Fill">
            <svg viewBox="0 0 24 24" class="shape-icon"><line x1="4" y1="3" x2="4" y2="21" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><line x1="20" y1="3" x2="20" y2="21" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
            <span>Side Bars</span>
          </button>
          <button class="shape-btn" data-shape="diffusion" title="Full Diffusion Box">
            <svg viewBox="0 0 24 24" class="shape-icon"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 2"/><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
            <span>Diffusion</span>
          </button>
        </div>
      </section>

      <section class="section controls-group">
        <div class="control-row">
          <div class="row-header">
            <label for="brightness-slider">Brightness</label>
            <span class="value-badge" id="brightness-val">90%</span>
          </div>
          <input type="range" id="brightness-slider" min="10" max="100" value="90" class="range-input" />
        </div>

        <div class="control-row">
          <div class="row-header">
            <label for="thickness-slider">Frame Thickness</label>
            <span class="value-badge" id="thickness-val">100px</span>
          </div>
          <input type="range" id="thickness-slider" min="20" max="250" step="5" value="100" class="range-input" />
        </div>

        <div class="control-row inline-switch">
          <label for="auto-trigger-toggle">Auto-on for Meet/Teams</label>
          <label class="switch sm">
            <input type="checkbox" id="auto-trigger-toggle" />
            <span class="slider round"></span>
          </label>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="hotkey-badge">
        <span>Toggle hotkey: <kbd>Alt + L</kbd> / <kbd>Option + L</kbd></span>
      </div>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
